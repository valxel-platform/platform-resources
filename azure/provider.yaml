# The Crossplane Azure providers this module uses (crossplane-contrib/provider-upjet-azure v2:
# namespaced managed resources under *.azure.m.upbound.io), each signing in with AKS Workload
# Identity: its ServiceAccount (crossplane-system/provider-azure) is federated to a managed identity
# that may manage the data plane's resource group, and assign roles there only from the catalog's
# data roles (a constrained role assignment, set up with the data plane in platform-foundation).
apiVersion: pkg.crossplane.io/v1beta1
kind: DeploymentRuntimeConfig
metadata:
  name: provider-azure
spec:
  serviceAccountTemplate:
    metadata:
      name: provider-azure
  deploymentTemplate:
    spec:
      selector: {}
      template:
        metadata:
          labels:
            azure.workload.identity/use: "true"
---
apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: provider-azure-managedidentity
spec:
  package: xpkg.crossplane.io/crossplane-contrib/provider-azure-managedidentity:v2.7.0
  runtimeConfigRef:
    name: provider-azure
---
apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: provider-azure-authorization
spec:
  package: xpkg.crossplane.io/crossplane-contrib/provider-azure-authorization:v2.7.0
  runtimeConfigRef:
    name: provider-azure
---
apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: provider-azure-cosmosdb
spec:
  package: xpkg.crossplane.io/crossplane-contrib/provider-azure-cosmosdb:v2.7.0
  runtimeConfigRef:
    name: provider-azure
---
apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: provider-azure-eventhub
spec:
  package: xpkg.crossplane.io/crossplane-contrib/provider-azure-eventhub:v2.7.0
  runtimeConfigRef:
    name: provider-azure
---
apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: provider-azure-servicebus
spec:
  package: xpkg.crossplane.io/crossplane-contrib/provider-azure-servicebus:v2.7.0
  runtimeConfigRef:
    name: provider-azure
---
apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: provider-azure-storage
spec:
  package: xpkg.crossplane.io/crossplane-contrib/provider-azure-storage:v2.7.0
  runtimeConfigRef:
    name: provider-azure
---
apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: provider-azure-dbforpostgresql
spec:
  package: xpkg.crossplane.io/crossplane-contrib/provider-azure-dbforpostgresql:v2.7.0
  runtimeConfigRef:
    name: provider-azure
---
apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: provider-azure-insights
spec:
  package: xpkg.crossplane.io/crossplane-contrib/provider-azure-insights:v2.7.0
  runtimeConfigRef:
    name: provider-azure
---
apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: provider-azure-network
spec:
  package: xpkg.crossplane.io/crossplane-contrib/provider-azure-network:v2.7.0
  runtimeConfigRef:
    name: provider-azure
---
# The Kafka types use provider-kafka against the environment's Strimzi cluster (strimzi/), as on
# Google Cloud; strimzi/provider.yaml installs it.
