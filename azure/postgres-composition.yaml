# Builds a PostgresDatabase as an Azure Database for PostgreSQL flexible server of its own
# (constitution VX-19, catalog type postgres on Azure).
#
#   FlexibleServer               private access only (the data plane's delegated subnet and DNS
#                                zone), TLS required, customer-managed key, 14 days of backups,
#                                zone-redundant HA on medium-ha and large; the `app` login's
#                                password from the Secret below, never in a status
#   Secret                       <name>-postgres in the cell namespace: the password, made once
#                                (random) and kept, with the endpoint, port and username: the
#                                admin connection a postgres-login signs in with (provider-sql)
#   FlexibleServerConfiguration  max_connections by size
#   FlexibleServerDatabase       the design's database
#   ManagementLock               CanNotDelete
#   MonitorMetricAlert           the catalog's alarms: CPU high, storage nearly full
#
# Sizes (the catalog's): small B_Standard_B1ms, 50 connections; medium GP_Standard_D2ds_v5, 400;
# medium-ha the same, zone-redundant; large GP_Standard_D4ds_v5, zone-redundant, 800.
# Settings come from the data plane's valxel-azure EnvironmentConfig.
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: postgres-azure
spec:
  compositeTypeRef:
    apiVersion: platform.valxel.dev/v1alpha1
    kind: PostgresDatabase
  mode: Pipeline
  pipeline:
    - step: load-settings
      functionRef:
        name: function-environment-configs
      input:
        apiVersion: environmentconfigs.fn.crossplane.io/v1beta1
        kind: Input
        spec:
          environmentConfigs:
            - type: Reference
              ref:
                name: valxel-azure

    - step: render
      functionRef:
        name: function-go-templating
      input:
        apiVersion: gotemplating.fn.crossplane.io/v1beta1
        kind: GoTemplate
        source: Inline
        inline:
          template: |
            {{- $xr := .observed.composite.resource }}
            {{- $env := index .context "apiextensions.crossplane.io/environment" }}
            {{- $nsHash := $xr.metadata.namespace | sha256sum | trunc 8 }}
            {{- $hash := printf "%s/%s" $xr.metadata.namespace $xr.metadata.name | sha256sum | trunc 12 }}
            {{- $tags := merge (dict) (default (dict) $xr.spec.tags) (default (dict) $env.tags) }}
            {{- $short := regexReplaceAll "[^a-z0-9]" (lower ($xr.metadata.name | trimPrefix "r-")) "" | trunc 10 }}
            {{- /* Globally unique names: the prefix, a little of the resource's name, and a hash of its namespace and name. */}}
            {{- $base := printf "%s-%s-%s" $env.namePrefix ($xr.metadata.name | trimPrefix "r-" | lower | trunc 20 | trimSuffix "-") $hash }}
            {{- $rg := printf "/subscriptions/%s/resourceGroups/%s" $env.subscription $env.resourceGroup }}
            {{- $users := list }}{{- range (default (list) $xr.spec.consumers) }}{{- $users = append $users .component }}{{- end }}
            {{- $who := printf "valxel product=%s feature=%s resource=%s env=%s consumers=%s"
                  (index $tags "valxel:product" | default "-") (index $tags "valxel:feature" | default "-")
                  (index $tags "valxel:resource" | default $xr.metadata.name) ($env.environment | default "-")
                  (join "," $users | default "-") }}
            {{- $name := $base | trunc 63 | trimSuffix "-" }}
            {{- $srv := printf "%s/providers/Microsoft.DBforPostgreSQL/flexibleServers/%s" $rg $name }}
            {{- $sizes := dict
                  "small" (dict "sku" "B_Standard_B1ms" "ha" false "connections" "50")
                  "medium" (dict "sku" "GP_Standard_D2ds_v5" "ha" false "connections" "400")
                  "medium-ha" (dict "sku" "GP_Standard_D2ds_v5" "ha" true "connections" "400")
                  "large" (dict "sku" "GP_Standard_D4ds_v5" "ha" true "connections" "800") }}
            {{- $size := index $sizes (default "small" $xr.spec.size) }}
            {{- $secret := printf "%s-postgres" $xr.metadata.name | trunc 63 | trimSuffix "-" }}
            {{- $host := "" }}
            {{- with getComposedResource . "server" }}{{- $host = dig "status" "atProvider" "fqdn" "" . }}{{- end }}
            {{- $dbReady := false }}
            {{- with getComposedResource . "database" }}{{- $dbReady = ne (dig "status" "atProvider" "id" "" .) "" }}{{- end }}
            {{- /* The password is made once: later reconciles keep what the Secret holds. */}}
            {{- $password := randAlphaNum 32 | b64enc }}
            {{- with getComposedResource . "password" }}{{- $password = dig "data" "password" $password . }}{{- end }}
            ---
            apiVersion: v1
            kind: Secret
            metadata:
              name: {{ $secret }}
              annotations:
                {{ setResourceNameAnnotation "password" }}
            type: Opaque
            data:
              password: {{ $password }}
              username: {{ "app" | b64enc }}
              port: {{ "5432" | b64enc }}
              endpoint: {{ $host | b64enc }}
            ---
            {{- /* How provider-sql signs in to this database, for the product's logins (postgres-login):
                   named after the database, so a login needs only the database's name. The admin
                   credentials stay in this namespace's Secret; only the provider reads them. */}}
            apiVersion: postgresql.sql.m.crossplane.io/v1alpha1
            kind: ProviderConfig
            metadata:
              name: {{ printf "%s-sql-admin" ($xr.spec.database | replace "_" "-") | trunc 63 | trimSuffix "-" }}
              annotations:
                {{ setResourceNameAnnotation "sql-admin" }}
            spec:
              defaultDatabase: {{ $xr.spec.database | quote }}
              sslMode: require
              credentials:
                source: PostgreSQLConnectionSecret
                connectionSecretRef:
                  name: {{ $secret }}
            ---
            apiVersion: dbforpostgresql.azure.m.upbound.io/v1beta1
            kind: FlexibleServer
            metadata:
              name: {{ $xr.metadata.name }}
              annotations:
                {{ setResourceNameAnnotation "server" }}
                crossplane.io/external-name: {{ $name | quote }}
            spec:
              managementPolicies: ["Observe", "Create", "Update", "LateInitialize"]
              forProvider:
                location: {{ $env.location | quote }}
                resourceGroupName: {{ $env.resourceGroup | quote }}
                version: {{ default "17" $xr.spec.version | toString | quote }}
                skuName: {{ $size.sku | quote }}
                storageMb: 32768
                autoGrowEnabled: true
                backupRetentionDays: 14
                zone: "1"
                {{- if $size.ha }}
                highAvailability:
                  mode: ZoneRedundant
                  standbyAvailabilityZone: "2"
                {{- end }}
                publicNetworkAccessEnabled: false
                delegatedSubnetId: {{ $env.postgresSubnetId | quote }}
                privateDnsZoneId: {{ $env.postgresDnsZoneId | quote }}
                administratorLogin: app
                administratorPasswordSecretRef:
                  name: {{ $secret | quote }}
                  key: password
                identity:
                  type: UserAssigned
                  identityIds: [{{ $env.cmkIdentityId | quote }}]
                customerManagedKey:
                  keyVaultKeyId: {{ $env.keyVaultKeyId | quote }}
                  primaryUserAssignedIdentityId: {{ $env.cmkIdentityId | quote }}
                tags:
                  {{- range $k, $v := $tags }}
                  {{ $k | quote }}: {{ $v | toString | quote }}
                  {{- end }}
            ---
            apiVersion: dbforpostgresql.azure.m.upbound.io/v1beta1
            kind: FlexibleServerConfiguration
            metadata:
              name: {{ printf "%s-max-connections" $xr.metadata.name | trunc 63 | trimSuffix "-" }}
              annotations:
                {{ setResourceNameAnnotation "max-connections" }}
            spec:
              forProvider:
                name: max_connections
                serverId: {{ $srv | quote }}
                value: {{ $size.connections | quote }}
            ---
            apiVersion: dbforpostgresql.azure.m.upbound.io/v1beta1
            kind: FlexibleServerDatabase
            metadata:
              name: {{ printf "%s-db" $xr.metadata.name | trunc 63 | trimSuffix "-" }}
              annotations:
                {{ setResourceNameAnnotation "database" }}
                crossplane.io/external-name: {{ $xr.spec.database | quote }}
            spec:
              managementPolicies: ["Observe", "Create", "Update", "LateInitialize"]
              forProvider:
                serverId: {{ $srv | quote }}
                charset: UTF8
                collation: en_US.utf8
            ---
            apiVersion: authorization.azure.m.upbound.io/v1beta1
            kind: ManagementLock
            metadata:
              name: {{ printf "%s-lock" $xr.metadata.name | trunc 63 | trimSuffix "-" }}
              annotations:
                {{ setResourceNameAnnotation "lock" }}
            spec:
              forProvider:
                name: valxel-keep
                scope: {{ $srv | quote }}
                lockLevel: CanNotDelete
                notes: "Valxel keeps this database when its binding goes: a person deletes it on purpose."
            {{- /* The catalog's standard alarms for postgres on Azure (sdlc-governance platform/catalog.yaml). */}}
            {{- $alarms := list
                  (dict "name" "cpu-high" "metric" "cpu_percent" "aggregation" "Average"
                        "period" 300 "periods" 3 "above" 80 "severity" "sev3"
                        "says" "CPU has been over 80% for 15 minutes: queries are slowing; look for a missing index, or a bigger size.")
                  (dict "name" "disk-high" "metric" "storage_percent" "aggregation" "Maximum"
                        "period" 300 "periods" 1 "above" 85 "severity" "sev2"
                        "says" "Storage is over 85% full; it grows by itself, but a fast climb means runaway writes.") }}
            {{- if $env.alarmActionGroup }}
            {{- $freq := dict "60" "PT1M" "300" "PT5M" "900" "PT15M" "1800" "PT30M" "3600" "PT1H" }}
            {{- range $alarms }}
            {{- $span := mul .period .periods }}
            {{- $window := "PT1M" }}
            {{- if gt $span 43200 }}{{ $window = "P1D" }}{{- else if gt $span 21600 }}{{ $window = "PT12H" }}{{- else if gt $span 3600 }}{{ $window = "PT6H" }}{{- else if gt $span 1800 }}{{ $window = "PT1H" }}{{- else if gt $span 900 }}{{ $window = "PT30M" }}{{- else if gt $span 300 }}{{ $window = "PT15M" }}{{- else if gt $span 60 }}{{ $window = "PT5M" }}{{- end }}
            ---
            apiVersion: insights.azure.m.upbound.io/v1beta1
            kind: MonitorMetricAlert
            metadata:
              name: {{ printf "%s-%s" $xr.metadata.name .name | trunc 63 | trimSuffix "-" }}
              annotations:
                {{ setResourceNameAnnotation (printf "alarm-%s" .name) }}
                crossplane.io/external-name: {{ printf "%s-%s" $base .name | quote }}
            spec:
              forProvider:
                resourceGroupName: {{ $env.resourceGroup | quote }}
                scopes: [{{ $srv | quote }}]
                description: {{ printf "%s alarm=%s severity=%s\n%s" $who .name .severity .says | quote }}
                severity: {{ index (dict "sev1" "0" "sev2" "1" "sev3" "2" "sev4" "3") .severity | default "2" }}
                frequency: {{ index $freq (toString .period) | default "PT5M" | quote }}
                windowSize: {{ $window | quote }}
                autoMitigate: true
                criteria:
                  - metricNamespace: Microsoft.DBforPostgreSQL/flexibleServers
                    metricName: {{ .metric | quote }}
                    aggregation: {{ .aggregation | quote }}
                    operator: GreaterThan
                    threshold: {{ .above }}
                    {{- with .where }}
                    {{- $kv := splitList "=" . }}
                    dimension:
                      - name: {{ index $kv 0 | quote }}
                        operator: Include
                        values: [{{ index $kv 1 | quote }}]
                    {{- end }}
                action:
                  - actionGroupId: {{ $env.alarmActionGroup | quote }}
                tags:
                  {{- range $k, $v := $tags }}
                  {{ $k | quote }}: {{ $v | toString | quote }}
                  {{- end }}
            {{- end }}
            {{- end }}
            {{- if and $host $dbReady }}
            ---
            apiVersion: platform.valxel.dev/v1alpha1
            kind: PostgresDatabase
            status:
              host: {{ $host | quote }}
              port: "5432"
              database: {{ $xr.spec.database | quote }}
              username: app
              secret: {{ $secret | quote }}
            {{- end }}

    - step: ready
      functionRef:
        name: function-auto-ready
