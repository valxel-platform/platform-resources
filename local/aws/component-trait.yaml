# A local OpenChoreo's components reach moto (local/aws) for AWS, as pods on EKS reach AWS through
# Pod Identity: install.py embeds this trait in every ClusterComponentType when OpenChoreo is beside
# the catalog (--openchoreo), so every component's main container gets the endpoint, placeholder
# credentials (moto takes any) and the region, with nothing in the product's own code or config.
# Only for a cluster whose AWS is moto: never on the platform.
apiVersion: openchoreo.dev/v1alpha1
kind: ClusterTrait
metadata:
  name: valxel-local-aws
  annotations:
    openchoreo.dev/description: Points a component's AWS SDK at moto, the local AWS emulator (laptop and CI only).
spec:
  patches:
    - target: {group: apps, version: v1, kind: Deployment}
      operations:
        - {op: add, path: "/spec/template/spec/containers/[?(@.name=='main')]/env/-", value: {name: AWS_ENDPOINT_URL, value: "http://moto.crossplane-system.svc.cluster.local:5000"}}
        - {op: add, path: "/spec/template/spec/containers/[?(@.name=='main')]/env/-", value: {name: AWS_ACCESS_KEY_ID, value: local}}
        - {op: add, path: "/spec/template/spec/containers/[?(@.name=='main')]/env/-", value: {name: AWS_SECRET_ACCESS_KEY, value: local}}
        - {op: add, path: "/spec/template/spec/containers/[?(@.name=='main')]/env/-", value: {name: AWS_REGION, value: us-east-1}}
        - {op: add, path: "/spec/template/spec/containers/[?(@.name=='main')]/env/-", value: {name: AWS_DEFAULT_REGION, value: us-east-1}}
    - target: {group: batch, version: v1, kind: CronJob}
      operations:
        - {op: add, path: "/spec/jobTemplate/spec/template/spec/containers/[?(@.name=='main')]/env/-", value: {name: AWS_ENDPOINT_URL, value: "http://moto.crossplane-system.svc.cluster.local:5000"}}
        - {op: add, path: "/spec/jobTemplate/spec/template/spec/containers/[?(@.name=='main')]/env/-", value: {name: AWS_ACCESS_KEY_ID, value: local}}
        - {op: add, path: "/spec/jobTemplate/spec/template/spec/containers/[?(@.name=='main')]/env/-", value: {name: AWS_SECRET_ACCESS_KEY, value: local}}
        - {op: add, path: "/spec/jobTemplate/spec/template/spec/containers/[?(@.name=='main')]/env/-", value: {name: AWS_REGION, value: us-east-1}}
        - {op: add, path: "/spec/jobTemplate/spec/template/spec/containers/[?(@.name=='main')]/env/-", value: {name: AWS_DEFAULT_REGION, value: us-east-1}}
