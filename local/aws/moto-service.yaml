# Moto runs beside the cluster as a Docker container on the cluster's network (install.py connects
# it), not in the cluster. This Service gives it a name inside the cluster; install.py fills in the
# container's address.
apiVersion: v1
kind: Service
metadata:
  name: moto
  namespace: crossplane-system
spec:
  ports:
    - name: http
      port: 5000
      targetPort: 5000
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: moto
  namespace: crossplane-system
  labels:
    kubernetes.io/service-name: moto
addressType: IPv4
ports:
  - name: http
    port: 5000
    protocol: TCP
endpoints:
  - addresses: ["${MOTO_IP}"]
---
# Some AWS APIs put the account ID in front of the host name (S3 Control:
# <account>.moto.crossplane-system.svc.cluster.local). k3s' CoreDNS reads extra rules from this
# ConfigMap; this one answers any such name with moto's Service. Applied server-side, so other keys
# of coredns-custom (OpenChoreo's, if any) stay.
apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns-custom
  namespace: kube-system
data:
  valxel-moto.override: |
    rewrite name regex (.+)\.moto\.crossplane-system\.svc\.cluster\.local moto.crossplane-system.svc.cluster.local answer auto
