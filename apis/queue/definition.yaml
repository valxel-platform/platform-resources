# Written by scripts/neutral.py from apis/sqs-queue/definition.yaml: change that file and run the script, not this one.
# The Queue API (the queue type, built as sqs-queue on AWS): An Amazon SQS queue with its dead-letter queue. The queue ClusterResourceType creates one in the cell namespace of
# each environment it is bound to; aws/queue-composition.yaml and gcp/queue-composition.yaml build it. Install on every data plane.
apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: queues.platform.valxel.dev
spec:
  scope: Namespaced
  group: platform.valxel.dev
  names:
    kind: Queue
    plural: queues
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                fifo:
                  type: boolean
                  description: First in, first out per message group. Never changes.
                  default: false
                visibility_timeout_s:
                  type: integer
                  description: Seconds a received message stays hidden before it is retried.
                  minimum: 0
                  maximum: 43200
                  default: 60
                max_receives:
                  type: integer
                  description: Receives before a message moves to the dead-letter queue.
                  minimum: 1
                  maximum: 1000
                  default: 5
                consumers:
                  type: array
                  description: >-
                    The components that use it and the access each is given (IAM actions on AWS, roles on Google Cloud) on it, from the
                    platform catalog's access (written by the SDLC tool from the approved design).
                  default: []
                  items:
                    type: object
                    required: [component, actions]
                    properties:
                      component:
                        type: string
                        pattern: "^[a-z0-9][a-z0-9-]{0,62}$"
                      access:
                        type: array
                        items: {type: string, enum: [read, write, delete]}
                      actions:
                        type: array
                        items: {type: string, pattern: "^([a-z0-9-]+:[A-Za-z*]+|roles/[A-Za-z0-9_.]+)$"}
                tags:
                  type: object
                  description: Tags for the AWS resources (product, feature, data class).
                  default: {}
                  additionalProperties: {type: string}
                size:
                  type: string
                  description: Relative size; the Composition maps it to capacity.
                  enum: [small, medium, large]
                  default: small
            status:
              type: object
              properties:
                sendTo:
                  type: string
                receiveFrom:
                  type: string
                id:
                  type: string
                deadLetterId:
                  type: string
