# The PostgresLogin API: a login of its own in a product database, for one component (catalog type
# postgres-login). Not chosen in designs: the SDLC tool makes one for each transform, from the
# approved design: the tables and columns it may read come from the data contracts. The
# postgres-login ClusterResourceType creates one in the cell namespace of each environment it is
# bound to; sql/postgres-login-composition.yaml asks the db-logins controller for it (VX-20): the
# component signs in with its own workload identity, and no password exists anywhere.
apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: postgreslogins.platform.valxel.dev
spec:
  scope: Namespaced
  group: platform.valxel.dev
  names:
    kind: PostgresLogin
    plural: postgreslogins
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [database, login, component]
              properties:
                database:
                  type: string
                  description: >-
                    The database the login is made in (the postgres resource's database). Its
                    Composition provides the ConfigMap <database>-sql-admin in this namespace: where
                    it is and how the controller signs in, no secret.
                  pattern: "^[a-z][a-z0-9_]{0,62}$"
                login:
                  type: string
                  description: >-
                    The login's own name, for its break-glass role (<login>_break_glass) and tokenize
                    key (<login>_key). Never changes. The role it signs in as is its component's
                    workload identity.
                  pattern: "^[a-z][a-z0-9_]{0,40}$"
                component:
                  type: string
                  description: The component that signs in, with its own WorkloadIdentity.
                reads:
                  type: array
                  description: >-
                    What the login may read: SELECT on these columns of these tables, and USAGE on
                    their schemas. Nothing else in the database is readable to it.
                  default: []
                  items:
                    type: object
                    required: [schema, table, columns]
                    properties:
                      schema: {type: string, pattern: "^[a-z_][a-z0-9_]{0,62}$"}
                      table: {type: string, pattern: "^[a-z_][a-z0-9_]{0,62}$"}
                      columns:
                        type: array
                        minItems: 1
                        items: {type: string, pattern: "^[a-z_][a-z0-9_]{0,62}$"}
                createSchemas:
                  type: boolean
                  description: CREATE on the database, for schemas of its own (a transform's build and published schemas).
                  default: false
                breakGlass:
                  type: boolean
                  description: >-
                    A NOLOGIN role <login>_break_glass that the login administers, so it can grant time-boxed
                    write access to its own objects to a person, and revoke it.
                  default: false
                tokenize:
                  type: boolean
                  description: >-
                    EXECUTE on <login>_key.tokenize(text): HMAC-SHA256 with a key made inside the
                    database and readable only by the function's owner. The key never leaves it.
                  default: false
                tags:
                  type: object
                  description: Labels (product, feature, component).
                  default: {}
                  additionalProperties: {type: string}
            status:
              type: object
              properties:
                host: {type: string}
                port: {type: string}
                database: {type: string}
                username:
                  type: string
                  description: The role the component signs in as, with a token from its own identity.
                auth:
                  type: string
                  description: How it signs in (gcp-iam, azure-entra).
                breakGlassRole: {type: string}
                tokenizeFunction: {type: string}
