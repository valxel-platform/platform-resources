# A login of its own in a product database, as an OpenChoreo ClusterResourceType (catalog type
# postgres-login). Not chosen in designs: the SDLC tool makes one per transform from the approved
# design (what it may read comes from the data contracts) and binds it with the component. It
# renders one PostgresLogin into the cell namespace; sql/postgres-login-composition.yaml asks the
# db-logins controller for it. No output is a secret (VX-20): the component signs in as its own
# workload identity with a short-lived token, and tokenizes through a function whose key stays in
# the database.
apiVersion: openchoreo.dev/v1alpha1
kind: ClusterResourceType
metadata:
  name: postgres-login
  annotations:
    openchoreo.dev/description: >-
      A login in a product database with exactly the grants its design approves, for the component's
      own workload identity, made by the Valxel platform's db-logins controller. No password.
spec:
  parameters:
    openAPIV3Schema:
      type: object
      required: [database, login, component]
      properties:
        database:
          type: string
          description: The database the login signs in to.
          pattern: "^[a-z][a-z0-9_]{0,62}$"
        login:
          type: string
          description: The login's own name (break-glass role, tokenize key). Never changes.
          pattern: "^[a-z][a-z0-9_]{0,40}$"
        component:
          type: string
          description: The component that signs in with its own workload identity.
        reads:
          type: array
          description: SELECT on these columns of these tables (written by the SDLC tool from the data contracts).
          default: []
          items:
            type: object
            required: [schema, table, columns]
            properties:
              schema: {type: string}
              table: {type: string}
              columns: {type: array, items: {type: string}}
        createSchemas:
          type: boolean
          default: false
        breakGlass:
          type: boolean
          default: false
        tokenize:
          type: boolean
          default: false
        tags:
          type: object
          default: {}
          additionalProperties: {type: string}

  # A login holds no data: unbinding it drops the role.
  retainPolicy: Delete

  outputs:
    - name: host
      value: ${applied.instance.status.host}
    - name: port
      value: ${applied.instance.status.port}
    - name: database
      value: ${applied.instance.status.database}
    - name: username
      value: ${applied.instance.status.username}
    - name: auth
      value: ${applied.instance.status.auth}
    - name: break_glass_role
      value: ${applied.instance.status.breakGlassRole}
    - name: tokenize_function
      value: ${applied.instance.status.tokenizeFunction}

  resources:
    - id: instance
      readyWhen: "${has(applied.instance.status.conditions) && applied.instance.status.conditions.exists(c, c.type == 'Ready' && c.status == 'True') && has(applied.instance.status.username)}"
      template:
        apiVersion: platform.valxel.dev/v1alpha1
        kind: PostgresLogin
        metadata:
          name: ${metadata.name}
          namespace: ${metadata.namespace}
          labels: ${metadata.labels}
        spec:
          database: ${parameters.database}
          login: ${parameters.login}
          component: ${parameters.component}
          reads: ${parameters.reads}
          createSchemas: ${parameters.createSchemas}
          breakGlass: ${parameters.breakGlass}
          tokenize: ${parameters.tokenize}
          tags: ${parameters.tags}
