# An Amazon Kinesis data stream, as an OpenChoreo ClusterResourceType (constitution VX-19). Apply on the control plane.
# The parameters are what a design's Resources line sets (the SDLC tool fills consumers and tags);
# environmentConfigs.size is set per environment by the binding. It renders one KinesisStream into the
# cell namespace; the data plane's Composition builds it in that environment's AWS account.
apiVersion: openchoreo.dev/v1alpha1
kind: ClusterResourceType
metadata:
  name: kinesis-stream
  annotations:
    openchoreo.dev/description: >-
      An Amazon Kinesis data stream, built by the Vrixel platform's Crossplane Composition with encryption, private
      access and least-privilege IAM.
spec:
  parameters:
    openAPIV3Schema:
      type: object
      properties:
        retention_hours:
          type: integer
          description: How long records stay readable, in hours.
          minimum: 24
          maximum: 8760
          default: 24
        consumers:
          type: array
          description: >-
            The components that use it and the IAM actions each may take on it, from the
            platform catalog's access (written by the SDLC tool from the approved design).
          default: []
          items:
            type: object
            required: [component, actions]
            properties:
              component:
                type: string
                pattern: "^[a-z0-9][a-z0-9-]{0,62}$"
              access:
                type: array
                items: {type: string, enum: [read, write, delete]}
              actions:
                type: array
                items: {type: string, pattern: "^[a-z0-9-]+:[A-Za-z*]+$"}
        tags:
          type: object
          description: Tags for the AWS resources (product, feature, data class).
          default: {}
          additionalProperties: {type: string}

  environmentConfigs:
    openAPIV3Schema:
      type: object
      properties:
        size:
          type: string
          enum: [small, medium, large]
          default: small

  # Stored data outlives its binding: removing it keeps the AWS resource (VX-19).
  retainPolicy: Retain

  outputs:
    - name: stream
      value: ${applied.instance.status.streamName}
    - name: arn
      value: ${applied.instance.status.arn}

  resources:
    - id: instance
      readyWhen: "${has(applied.instance.status.conditions) && applied.instance.status.conditions.exists(c, c.type == 'Ready' && c.status == 'True') && has(applied.instance.status.streamName) && has(applied.instance.status.arn)}"
      template:
        apiVersion: aws.platform.vrixel.dev/v1alpha1
        kind: KinesisStream
        metadata:
          name: ${metadata.name}
          namespace: ${metadata.namespace}
          labels: ${metadata.labels}
        spec:
          retention_hours: ${parameters.retention_hours}
          consumers: ${parameters.consumers}
          tags: ${parameters.tags}
          size: ${environmentConfigs.size}
