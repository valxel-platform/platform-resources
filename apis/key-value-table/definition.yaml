# Written by scripts/neutral.py from apis/dynamodb-table/definition.yaml: change that file and run the script, not this one.
# The KeyValueTable API (the key-value-table type, built as dynamodb-table on AWS): An Amazon DynamoDB table. The key-value-table ClusterResourceType creates one in the cell namespace of
# each environment it is bound to; aws/, gcp/ and azure/key-value-table-composition.yaml build it. Install on every data plane.
apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: keyvaluetables.platform.valxel.dev
spec:
  scope: Namespaced
  group: platform.valxel.dev
  names:
    kind: KeyValueTable
    plural: keyvaluetables
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [partition_key]
              properties:
                partition_key:
                  type: string
                  description: Attribute name of the partition (hash) key, a string. Never changes.
                  pattern: "^[A-Za-z_][A-Za-z0-9_.-]{0,254}$"
                sort_key:
                  type: string
                  description: Attribute name of the sort (range) key, a string; empty for none. Never changes.
                  default: ""
                ttl_attribute:
                  type: string
                  description: Attribute holding an expiry time (epoch seconds); empty for none.
                  default: ""
                indexes:
                  type: array
                  description: "Global secondary indexes, each name:partition_key[:sort_key] (string keys)."
                  default: []
                  items:
                    type: string
                    pattern: "^[A-Za-z0-9_.-]{3,255}:[A-Za-z_][A-Za-z0-9_.-]*(:[A-Za-z_][A-Za-z0-9_.-]*)?$"
                consumers:
                  type: array
                  description: >-
                    The components that use it and the access each is given (IAM actions on AWS, roles on Google Cloud and Azure) on it, from the
                    platform catalog's access (written by the SDLC tool from the approved design).
                  default: []
                  items:
                    type: object
                    required: [component, actions]
                    properties:
                      component:
                        type: string
                        pattern: "^[a-z0-9][a-z0-9-]{0,62}$"
                      access:
                        type: array
                        items: {type: string, enum: [read, write, delete]}
                      actions:
                        type: array
                        items: {type: string, pattern: "^([a-z0-9-]+:[A-Za-z*]+|roles/[A-Za-z0-9_.]+|(role|cosmos):[A-Za-z -]+)$"}
                tags:
                  type: object
                  description: Tags for the AWS resources (product, feature, data class).
                  default: {}
                  additionalProperties: {type: string}
                size:
                  type: string
                  description: Relative size; the Composition maps it to capacity.
                  enum: [small, medium, large]
                  default: small
            status:
              type: object
              properties:
                table:
                  type: string
                id:
                  type: string
