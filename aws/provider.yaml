# The Crossplane AWS providers this module uses, each authenticating with EKS Pod Identity.
# Each provider needs a Pod Identity association for its ServiceAccount
# (crossplane-system/<provider name>) linked to an IAM role allowed to manage its service in this
# account; the ServiceAccount names are fixed so the associations survive upgrades. Create the
# associations before the providers. provider-aws-iam's role may only create roles under the
# platform's permissions boundary (environment-config.yaml).
apiVersion: pkg.crossplane.io/v1beta1
kind: DeploymentRuntimeConfig
metadata:
  name: provider-aws-dynamodb
spec:
  serviceAccountTemplate:
    metadata:
      name: provider-aws-dynamodb
---
apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: provider-aws-dynamodb
spec:
  package: xpkg.crossplane.io/crossplane-contrib/provider-aws-dynamodb:v2.9.0
  runtimeConfigRef:
    name: provider-aws-dynamodb
---
