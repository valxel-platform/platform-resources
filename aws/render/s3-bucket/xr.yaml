# A S3Bucket as OpenChoreo renders it into a cell namespace, for `crossplane composition render`
# (see README, Checking a Composition).
apiVersion: aws.platform.valxel.dev/v1alpha1
kind: S3Bucket
metadata:
  name: r-field-photos-development-1a2b3c4d
  namespace: dp-default-agtech-development-5f6e7d8c
spec:
  versioning: true
  expire_days: 365
  consumers:
  - component: agtech-field-api
    access:
    - read
    - write
    actions:
    - s3:GetObject
    - s3:ListBucket
    - s3:PutObject
  tags:
    valxel:product: AG
    valxel:feature: AG-FEAT-7
    valxel:data-class: general
  size: small
