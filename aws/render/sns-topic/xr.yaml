# A SnsTopic as OpenChoreo renders it into a cell namespace, for `crossplane composition render`
# (see README, Checking a Composition).
apiVersion: aws.platform.valxel.dev/v1alpha1
kind: SnsTopic
metadata:
  name: r-alerts-development-1a2b3c4d
  namespace: dp-default-agtech-development-5f6e7d8c
spec:
  fifo: false
  consumers:
  - component: agtech-field-api
    access:
    - write
    actions:
    - sns:Publish
  tags:
    valxel:product: AG
    valxel:feature: AG-FEAT-7
    valxel:data-class: general
  size: small
