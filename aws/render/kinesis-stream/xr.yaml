# A KinesisStream as OpenChoreo renders it into a cell namespace, for `crossplane composition render`
# (see README, Checking a Composition).
apiVersion: aws.platform.vrixel.dev/v1alpha1
kind: KinesisStream
metadata:
  name: r-readings-development-1a2b3c4d
  namespace: dp-default-agtech-development-5f6e7d8c
spec:
  retention_hours: 168
  consumers:
  - component: agtech-sensor-api
    access:
    - write
    actions:
    - kinesis:PutRecord
    - kinesis:PutRecords
  - component: agtech-field-worker
    access:
    - read
    actions:
    - kinesis:GetRecords
    - kinesis:GetShardIterator
  tags:
    vrixel:product: AG
    vrixel:feature: AG-FEAT-7
    vrixel:data-class: general
  size: medium
