# A product's request for a database login (VX-20): made by postgres-login's Composition in the
# product's namespace, carried out by the db-logins controller in valxel-db-logins.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: databaselogins.platform.valxel.dev
spec:
  group: platform.valxel.dev
  scope: Namespaced
  names: { kind: DatabaseLogin, plural: databaselogins, singular: databaselogin }
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources: { status: {} }
      additionalPrinterColumns:
        - { name: Login, type: string, jsonPath: .spec.login }
        - { name: User, type: string, jsonPath: .status.username }
        - { name: Ready, type: string, jsonPath: ".status.conditions[?(@.type=='Ready')].status" }
        - { name: Reason, type: string, jsonPath: ".status.conditions[?(@.type=='Ready')].reason" }
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [server, login, principal]
              properties:
                server:
                  type: string
                  description: The database's ConfigMap (<database>-sql-admin), made by its Composition.
                login:
                  type: string
                  pattern: "^[a-z][a-z0-9_]{0,40}$"
                  description: The login's own name, for its break-glass role and tokenize key.
                principal:
                  type: object
                  description: >-
                    Who signs in: the component whose WorkloadIdentity it is. (password exists only for
                    the end-to-end test; the controller refuses it in every environment.)
                  properties:
                    component: { type: string }
                    password:
                      type: object
                      properties: { user: { type: string }, secret: { type: string } }
                reads:
                  type: array
                  items:
                    type: object
                    required: [table, columns]
                    properties:
                      schema: { type: string, default: public }
                      table: { type: string }
                      columns: { type: array, minItems: 1, items: { type: string } }
                createSchemas: { type: boolean, default: false }
                breakGlass: { type: boolean, default: false }
                tokenize: { type: boolean, default: false }
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
