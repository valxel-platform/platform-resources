# The Crossplane Google Cloud providers this module uses (crossplane-contrib/provider-upjet-gcp v3 (Firestore since v3.0):
# namespaced managed resources under *.gcp.m.upbound.io), each authenticating with GKE Workload
# Identity: its ServiceAccount (crossplane-system/<provider name>) is bound to a Google service
# account allowed to manage its service in this project. Create the bindings before the providers.
# provider-gcp-cloudplatform's account may create service accounts and grant roles only on this
# project, and only the roles the catalog names (an IAM deny policy or organization policy, set up
# with the data plane in platform-foundation).
apiVersion: pkg.crossplane.io/v1beta1
kind: DeploymentRuntimeConfig
metadata:
  name: provider-gcp
spec:
  serviceAccountTemplate:
    metadata:
      name: provider-gcp
---
apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: provider-gcp-pubsub
spec:
  package: xpkg.crossplane.io/crossplane-contrib/provider-gcp-pubsub:v3.1.0
  runtimeConfigRef:
    name: provider-gcp
---
apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: provider-gcp-storage
spec:
  package: xpkg.crossplane.io/crossplane-contrib/provider-gcp-storage:v3.1.0
  runtimeConfigRef:
    name: provider-gcp
---
apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: provider-gcp-firestore
spec:
  package: xpkg.crossplane.io/crossplane-contrib/provider-gcp-firestore:v3.1.0
  runtimeConfigRef:
    name: provider-gcp
---
apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: provider-gcp-cloudplatform
spec:
  package: xpkg.crossplane.io/crossplane-contrib/provider-gcp-cloudplatform:v3.1.0
  runtimeConfigRef:
    name: provider-gcp
---
apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: provider-gcp-monitoring
spec:
  package: xpkg.crossplane.io/crossplane-contrib/provider-gcp-monitoring:v3.1.0
  runtimeConfigRef:
    name: provider-gcp
---
# The Kafka types use provider-kafka against the environment's Strimzi cluster (strimzi/), as
# outside production on AWS; strimzi/provider.yaml installs it.
