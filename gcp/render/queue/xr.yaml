# A Queue as OpenChoreo renders it into a cell namespace on a Google Cloud data plane, labels as the SDLC tool writes them, for `crossplane composition render` (see README, Checking a Composition).
apiVersion: platform.valxel.dev/v1alpha1
kind: Queue
metadata:
  name: r-jobs-development-1a2b3c4d
  namespace: dp-default-agtech-development-5f6e7d8c
spec:
  fifo: true
  visibility_timeout_s: 120
  max_receives: 3
  consumers:
  - component: agtech-field-api
    access:
    - write
    actions:
    - roles/pubsub.publisher
  - component: agtech-field-worker
    access:
    - read
    actions:
    - roles/pubsub.subscriber
  tags:
    valxel_product: ag
    valxel_feature: ag-feat-7
    valxel_resource: jobs
    valxel_data-class: general
  size: small
