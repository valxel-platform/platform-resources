# Crossplane's SQL provider (crossplane-contrib/provider-sql), for postgres-login: a login per
# component in a product database, with exactly the grants its design approves. Cloud-neutral: it
# signs in to the database over the network with the database's own admin credentials, so it runs
# on every data plane, after Crossplane v2 and functions.yaml.
apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: provider-sql
spec:
  package: xpkg.crossplane.io/crossplane-contrib/provider-sql:v0.16.2
