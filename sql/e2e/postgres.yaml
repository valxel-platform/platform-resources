# A product database for the postgres-login end-to-end check: Postgres 17 with TLS (the login's
# provider connects with sslMode require), and its admin Secret with the keys the catalog names
# for the managed databases (endpoint, port, username, password). Synthetic; test only.
apiVersion: v1
kind: Namespace
metadata:
  name: e2e-sql
---
apiVersion: v1
kind: Secret
metadata:
  name: emr-db-postgres
  namespace: e2e-sql
type: Opaque
stringData:
  endpoint: postgres.e2e-sql.svc.cluster.local
  port: "5432"
  username: app
  password: admin-only-e2e-password
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: e2e-sql
spec:
  replicas: 1
  selector: { matchLabels: { app: postgres } }
  template:
    metadata: { labels: { app: postgres } }
    spec:
      containers:
        - name: postgres
          image: postgres:17
          args: ["-c", "ssl=on", "-c", "ssl_cert_file=/etc/ssl/certs/ssl-cert-snakeoil.pem",
                 "-c", "ssl_key_file=/etc/ssl/private/ssl-cert-snakeoil.key"]
          env:
            - { name: POSTGRES_USER, value: app }
            - { name: POSTGRES_PASSWORD, value: admin-only-e2e-password }
            - { name: POSTGRES_DB, value: emr }
          ports: [{ containerPort: 5432 }]
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "app", "-d", "emr"] }
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: e2e-sql
spec:
  selector: { app: postgres }
  ports: [{ port: 5432, targetPort: 5432 }]
