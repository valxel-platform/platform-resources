# Asks for a PostgresLogin on every cloud (catalog type postgres-login), with no password anywhere
# (constitution VX-20).
#
#   DatabaseLogin    <name>: the request the db-logins controller (controllers/db-logins) carries out
#                    in the database, from its own platform namespace, signing in with the platform's
#                    identity (the database's IAM or Entra admin) and a short-lived token:
#                    - the component's own workload identity becomes the role it signs in as;
#                    - CONNECT, and CREATE when spec.createSchemas; USAGE on each schema spec.reads
#                      names, and SELECT on exactly its columns of exactly its tables;
#                    - with spec.breakGlass, <login>_break_glass (NOLOGIN), which the login administers;
#                    - with spec.tokenize, <login>_key.tokenize(text): HMAC-SHA256 with a key made in the
#                      database, readable only by the function's owner.
#                    It points at the database's ConfigMap <database>-sql-admin, which the database's
#                    Composition makes in this namespace (where it is, how to sign in; no secret).
#
# The XR's status is the login's, once the controller reports it Ready: host, port, database, the
# username the component signs in as, and the names of its break-glass role and tokenize function.
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: postgres-login
spec:
  compositeTypeRef:
    apiVersion: platform.valxel.dev/v1alpha1
    kind: PostgresLogin
  mode: Pipeline
  pipeline:
    - step: render
      functionRef:
        name: function-go-templating
      input:
        apiVersion: gotemplating.fn.crossplane.io/v1beta1
        kind: GoTemplate
        source: Inline
        inline:
          template: |
            {{- $xr := .observed.composite.resource }}
            {{- $server := printf "%s-sql-admin" ($xr.spec.database | replace "_" "-") | trunc 63 | trimSuffix "-" }}
            {{- $made := dict }}
            {{- with getComposedResource . "login" }}
            {{- $ok := false }}
            {{- range (dig "status" "conditions" (list) .) }}{{- if and (eq .type "Ready") (eq .status "True") }}{{- $ok = true }}{{- end }}{{- end }}
            {{- if $ok }}{{- $made = .status }}{{- end }}
            {{- end }}
            ---
            apiVersion: platform.valxel.dev/v1alpha1
            kind: DatabaseLogin
            metadata:
              name: {{ $xr.metadata.name }}
              labels:
                {{- range $k, $v := default (dict) $xr.spec.tags }}
                {{ $k }}: {{ $v | toString | quote }}
                {{- end }}
              annotations:
                {{ setResourceNameAnnotation "login" }}
            spec:
              server: {{ $server }}
              login: {{ $xr.spec.login }}
              principal:
                component: {{ $xr.spec.component | quote }}
              reads:
                {{- range $xr.spec.reads }}
                - schema: {{ .schema }}
                  table: {{ .table }}
                  columns: [{{ range $i, $c := .columns }}{{ if $i }}, {{ end }}{{ $c | quote }}{{ end }}]
                {{- else }} []
                {{- end }}
              createSchemas: {{ $xr.spec.createSchemas | default false }}
              breakGlass: {{ $xr.spec.breakGlass | default false }}
              tokenize: {{ $xr.spec.tokenize | default false }}
            {{- if $made }}
            ---
            apiVersion: platform.valxel.dev/v1alpha1
            kind: PostgresLogin
            status:
              host: {{ $made.host | quote }}
              port: {{ $made.port | quote }}
              database: {{ $made.database | quote }}
              username: {{ $made.username | quote }}
              auth: {{ $made.auth | quote }}
              breakGlassRole: {{ $made.breakGlassRole | default "" | quote }}
              tokenizeFunction: {{ $made.tokenizeFunction | default "" | quote }}
            {{- end }}

    - step: ready
      functionRef:
        name: function-auto-ready
