# The db-logins controller's image (controllers/db-logins, constitution VX-20): built on every push
# to main that changes it, scanned, pushed to GHCR, signed keyless with cosign, with its SBOM and build
# provenance. platform-foundation pins it by digest (releases.yaml); scripts/check-releases.py there
# checks the signature names this workflow.
name: publish-db-logins

on:
  push:
    branches: [main]
    paths: ["controllers/db-logins/**", ".github/workflows/publish-db-logins.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: publish
    if: github.repository == 'valxel-platform/platform-resources'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write       # keyless signing and provenance
      attestations: write
    env:
      IMAGE: ghcr.io/valxel-platform/db-logins
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        run: docker build --pull -t local controllers/db-logins
      - name: It starts
        run: docker run --rm --entrypoint python local -c "import db_logins.main"
      - name: No high or critical vulnerabilities with a fix
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: local
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Push
        id: push
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          SHA: ${{ github.sha }}
        run: |
          echo "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          for t in "sha-$SHA" main; do
            docker tag local "$IMAGE:$t"
            docker push "$IMAGE:$t"
          done
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:sha-$SHA" | cut -d@ -f2)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Sign
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"
      - name: SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE }}@${{ steps.push.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false
      - name: Attest the SBOM
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign attest --yes --type spdxjson --predicate sbom.spdx.json "$IMAGE@$DIGEST"
      - name: Build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - name: Summary
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: echo "Published \`$IMAGE@$DIGEST\`, signed, with its SBOM and provenance. Pin the digest in platform-foundation's releases.yaml." >> "$GITHUB_STEP_SUMMARY"
