# Required check: render. It checks the module against the platform catalog, renders every
# Composition with Crossplane (first reconcile and after the cloud reports), and validates what they
# compose against the AWS, Google Cloud and Azure providers' schemas and this module's XRDs.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Pin a Crossplane CLI release here once you have one you trust; "current" is the latest stable.
  CROSSPLANE_VERSION: current
  # The catalog's sdlc-governance ref; a catalog change merges there first.
  VALXEL_CATALOG_REF: b78f44d562f505340a3dd921c36a9bddf6c10513  # sdlc-governance#38; back to main once it merges

jobs:
  render:
    name: render
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the module against the catalog
        run: |
          pip install --quiet "pytest==9.2.0" "pyyaml==6.0.3" "jsonschema==4.26.0"
          python3 -m pytest -q tests
      - name: Install the Crossplane CLI
        run: |
          curl -sSfL https://raw.githubusercontent.com/crossplane/crossplane/main/install.sh \
            | XP_CHANNEL=stable XP_VERSION="$CROSSPLANE_VERSION" sh
          sudo mv crossplane /usr/local/bin/
          crossplane version --client
      - name: Render every Composition
        run: |
          mkdir -p out
          # Newer CLIs: `crossplane composition render --required-resources`; older: `crossplane render --extra-resources`.
          render() {
            local xr=$1 comp=$2 xrd=$3 settings=$4; shift 4
            crossplane composition render "$xr" "$comp" functions.yaml --xrd "$xrd" \
                --required-resources "$settings" "$@" 2>/dev/null \
              || crossplane render "$xr" "$comp" functions.yaml --xrd "$xrd" \
                --extra-resources "$settings" "$@"
          }
          # aws/: every type on AWS (MSK for Kafka). gcp/ and azure/: every type on Google Cloud and
          # Azure but Kafka. strimzi/: the Kafka types outside AWS production. k8s/: in-cluster
          # objects (code-runner).
          for flavour in aws gcp azure strimzi k8s; do
            for dir in $flavour/render/*/; do
              kind=$(basename "$dir")
              settings=$flavour/render/environment-config.yaml
              render "$dir/xr.yaml" "$flavour/$kind-composition.yaml" "apis/$kind/definition.yaml" "$settings" \
                > "out/$flavour-$kind-first.yaml"
              if grep -q '^kind:' "$dir/observed.yaml"; then
                render "$dir/xr.yaml" "$flavour/$kind-composition.yaml" "apis/$kind/definition.yaml" "$settings" \
                  --observed-resources "$dir/observed.yaml" > "out/$flavour-$kind-later.yaml"
              else  # composes nothing (kafka-user on MSK): the first render is the only one
                cp "out/$flavour-$kind-first.yaml" "out/$flavour-$kind-later.yaml"
              fi
              echo "$flavour/$kind: $(grep -c '^kind:' "out/$flavour-$kind-later.yaml") objects once reported"
            done
          done
      - name: Validate against the provider and XRD schemas
        run: |
          # One YAML stream: each file's documents, separated.
          for f in aws/provider.yaml gcp/provider.yaml azure/provider.yaml apis/*/definition.yaml k8s/agent-sandbox-crds-*.yaml; do cat "$f"; printf '\n---\n'; done > extensions.yaml
          # Validate what the Compositions compose. The XRs are this module's own inputs; the
          # tests check them against the XRDs and the catalog.
          python3 - <<'PY'
          import glob, os, yaml
          os.makedirs("composed", exist_ok=True)
          for path in glob.glob("out/*.yaml"):
              docs = [d for d in yaml.safe_load_all(open(path)) if d and not d.get("apiVersion", "").startswith(("aws.platform.valxel.dev/", "platform.valxel.dev/", "runtime.platform.valxel.dev/"))]
              with open(os.path.join("composed", os.path.basename(path)), "w") as f:
                  yaml.safe_dump_all(docs, f, sort_keys=False)
          PY
          # The CLI moved validate under `resource`; older ones have it under `beta`.
          set -o pipefail  # a failed validation fails the step, through tee
          # A missing schema fails too, but for Cilium's policies (the data plane's CNI, no package).
          if crossplane resource validate --help >/dev/null 2>&1; then
            crossplane resource validate extensions.yaml composed/ --skip-success-results | tee validate.txt
          else
            crossplane beta validate extensions.yaml composed/ --skip-success-results | tee validate.txt
          fi
          if grep 'could not find CRD/XRD' validate.txt | grep -v 'Kind=CiliumNetworkPolicy'; then
            echo "::error::composed objects without a schema (a provider missing from */provider.yaml, or a wrong API group)"
            exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: rendered
          path: out/
          retention-days: 14
