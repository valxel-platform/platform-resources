# postgres-login end to end (tracker CP-127): a k3d cluster with Crossplane, the functions and
# provider-sql, a real Postgres with TLS, and a transform's login made from its XR. Passes when the
# login can read exactly the columns it was given, make its own schemas, administer its break-glass
# role, and nothing else (sql/e2e/check.sh).
name: sql-login

on:
  pull_request:
    paths: ["sql/**", "apis/postgres-login/**", "functions.yaml", ".github/workflows/sql-login.yml"]
  push:
    branches: [main]
    paths: ["sql/**", "apis/postgres-login/**", "functions.yaml", ".github/workflows/sql-login.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sql-login-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  K3D_VERSION: v5.8.3
  K3D_SHA256: dbaa79a76ace7f4ca230a1ff41dc7d8a5036a8ad0309e9c54f9bf3836dbe853e  # k3d-linux-amd64, the release's checksums.txt
  CROSSPLANE_VERSION: "2.4.3"  # platform-foundation gitops/infrastructure/crossplane/release.yaml

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install k3d
        run: |
          curl -sSfL -o /tmp/k3d "https://github.com/k3d-io/k3d/releases/download/$K3D_VERSION/k3d-linux-amd64"
          echo "$K3D_SHA256  /tmp/k3d" | sha256sum -c -
          sudo install -m 0755 /tmp/k3d /usr/local/bin/k3d && k3d version
      - name: A cluster with Crossplane, the functions and provider-sql
        run: |
          k3d cluster create e2e --no-lb --k3s-arg "--disable=traefik@server:0" --wait
          helm --kube-context k3d-e2e upgrade --install crossplane crossplane --repo https://charts.crossplane.io/stable \
            --version "$CROSSPLANE_VERSION" --namespace crossplane-system --create-namespace --wait
          kubectl --context k3d-e2e apply -f functions.yaml -f sql/provider.yaml
          kubectl --context k3d-e2e wait functions.pkg.crossplane.io,providers.pkg.crossplane.io --all \
            --for=condition=Healthy --timeout=10m
      - name: A transform's login, end to end
        run: sql/e2e/check.sh k3d-e2e
      - name: What happened
        if: failure()
        run: |
          kubectl --context k3d-e2e -n e2e-sql get postgreslogins,managed -o wide || true
          kubectl --context k3d-e2e -n e2e-sql describe postgreslogins || true
          for p in $(kubectl --context k3d-e2e -n crossplane-system get pods -o name | grep provider-sql); do
            echo "::group::$p"; kubectl --context k3d-e2e -n crossplane-system logs "$p" --tail=120 || true; echo "::endgroup::"
          done
