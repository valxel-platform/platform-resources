# The independent review on every pull request (valxel-platform/agentic-sdlc,
# .github/workflows/independent-review.yml; T-139). Runs from the base branch, so a pull request
# can't change the review it gets. Pinned: Renovate proposes newer versions.
# Off until the INDEPENDENT_REVIEW variable (the org's or this repo's) is `on`: skipped, not failed.
name: review
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
permissions: {}
concurrency:
  group: review-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  independent:
    if: ${{ vars.INDEPENDENT_REVIEW == 'on' }}
    uses: valxel-platform/agentic-sdlc/.github/workflows/independent-review.yml@b2e10f700528680bf835eaf29e0ff84ff7a71042
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    with:
      # High risk beyond the defaults.
      high_risk_paths: |
        *.yaml
        *.yml
