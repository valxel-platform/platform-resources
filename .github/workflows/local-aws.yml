# The AWS catalog against moto, end to end (tracker CP-117): a k3d cluster with Crossplane, the AWS
# providers pointed at moto (local/aws), and a feature's resources applied as OpenChoreo renders
# them. Passes when Crossplane reports them ready and moto holds what they built. This is the
# local path `valxel dev cluster up --aws` gives developers (agentic-sdlc); it proves the
# Compositions and providers work end to end, not that AWS itself behaves as moto does.
name: local-aws

on:
  pull_request:
    paths: ["aws/**", "apis/**", "functions.yaml", "local/**", ".github/workflows/local-aws.yml"]
  push:
    branches: [main]
    paths: ["aws/**", "apis/**", "functions.yaml", "local/**", ".github/workflows/local-aws.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: local-aws-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  K3D_VERSION: v5.8.3
  K3D_SHA256: dbaa79a76ace7f4ca230a1ff41dc7d8a5036a8ad0309e9c54f9bf3836dbe853e  # k3d-linux-amd64, the release's checksums.txt
  MOTO_IMAGE: motoserver/moto:5.2.6

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install k3d
        run: |
          curl -sSfL -o /tmp/k3d "https://github.com/k3d-io/k3d/releases/download/$K3D_VERSION/k3d-linux-amd64"
          echo "$K3D_SHA256  /tmp/k3d" | sha256sum -c -
          sudo install -m 0755 /tmp/k3d /usr/local/bin/k3d && k3d version
      - name: Start moto and a cluster
        run: |
          docker run -d --name valxel-moto "$MOTO_IMAGE"
          k3d cluster create e2e --no-lb --k3s-arg "--disable=traefik@server:0" --wait
          kubectl --context k3d-e2e get nodes
      - name: Install the AWS catalog, pointed at moto
        run: |
          pip install --quiet "pyyaml==6.0.3"
          python3 local/aws/install.py --context k3d-e2e --crossplane
      - name: A feature's resources, end to end
        run: local/aws/e2e/check.sh k3d-e2e
      - name: What happened
        if: failure()
        run: |
          kubectl --context k3d-e2e get providers.pkg.crossplane.io,functions.pkg.crossplane.io || true
          kubectl --context k3d-e2e -n crossplane-system get pods || true
          for p in $(kubectl --context k3d-e2e -n crossplane-system get pods -o name | grep provider-aws); do
            echo "::group::$p"; kubectl --context k3d-e2e -n crossplane-system logs "$p" --tail=80 || true; echo "::endgroup::"
          done
          docker logs valxel-moto --tail 200 || true
