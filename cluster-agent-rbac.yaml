# Lets the OpenChoreo data-plane agent manage this module's composite resources (DynamoTable,
# KinesisStream, ...), which the ClusterResourceTypes render. Crossplane creates the AWS resources
# behind them under its own permissions. Apply on each data plane. If your agent runs under another
# ServiceAccount, edit the subject.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: valxel-platform-resources-agent
rules:
  - apiGroups: ["aws.platform.valxel.dev"]
    resources: ["*"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: valxel-platform-resources-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: valxel-platform-resources-agent
subjects:
  - kind: ServiceAccount
    name: cluster-agent-dataplane
    namespace: openchoreo-data-plane
