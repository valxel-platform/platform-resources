kind: CodeRunner
metadata:
  name: emr-calc-sandbox-runner
  namespace: dp-default-emr-development-5f6e7d8c
spec:
  component: emr-calc-sandbox
  service_account: ""
  tags:
    valxel:product: EMR
    valxel:data-class: phi
  size: medium
